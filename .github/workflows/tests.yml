name: Tests

on:
  push:
    branches: [main]
    paths: ["backend/**", "tests/**", "pyproject.toml", "uv.lock"]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run tests
        env:
          GROQ_API_KEY: dummy-key-for-tests
        run: uv run python -m pytest -v